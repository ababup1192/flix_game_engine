name: Release Gate

# tag (v*) を push したとき、エンジン全パッケージがコンパイルできることを確認する門番。
# 描画スナップショットは OS/JRE のフォント計測差でズレるため CI では回さない。
# スナップショットを含む全テストは開発機ローカルの `make release`（全量の門）に任せ、CI は「ビルドが通るか」だけを見る。
# 注: タグは release.yml が GITHUB_TOKEN で作るので、このワークフローは on: push: tags では起きない（GitHub の仕様）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # devbox が nix 経由で JDK25 / Flix コンパイラ / make を用意する（ローカルと同じ環境）。
      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0

      # make sync は engine_full（4 パッケージの src を集めた物）を build-pkg する = 全パッケージのコンパイル検証になる。
      - name: Build all packages
        run: devbox run -- make sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
