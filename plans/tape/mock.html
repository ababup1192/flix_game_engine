<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>テープ（モック・広い画面）— 血鱗 序章</title>
<style>
  :root {
    --bg: #000; --surface: #111113; --raised: #1c1c1f; --hair: rgba(255,255,255,.08);
    --text: #f2f2f2; --dim: rgba(255,255,255,.6); --faint: rgba(255,255,255,.34);
    --accent: #ffcc4d;
    --c-video: #6cc4ff; --c-script: #c8a6ff; --c-sound: #ffcc4d;
    --witch: #c8a6ff; --girl: #ffb46b; --narr: #e6e6e6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }

  /* 上の帯 */
  .top { flex: none; height: 44px; display: flex; align-items: center; padding: 0 10px 0 4px; gap: 4px; }
  .iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; position: relative; }
  .iconbtn:active { background: var(--hair); }
  .count { position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: #fff; color: #000;
    font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .title { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }
  .title b { font-size: 14px; font-weight: 600; }
  .title small { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .export { height: 30px; padding: 0 12px; border-radius: 99px; background: var(--accent); color: #1a1300; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .export:disabled { background: var(--raised); color: var(--faint); }
  .mock { font-size: 9px; font-weight: 700; color: #1a1300; background: var(--accent); border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 2px; }

  /* 動画 */
  .preview { flex: 1 1 auto; min-height: 120px; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 0 6px; }
  .frame { position: relative; height: 100%; aspect-ratio: var(--frame-ratio, auto); max-width: 100%; }
  .frame video, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame video { object-fit: contain; border-radius: 8px; }
  .frame canvas { touch-action: none; }
  .glyph { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%; background: rgba(0,0,0,.45);
    backdrop-filter: blur(8px); display: grid; place-items: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .glyph.on { opacity: 1; }
  .pill { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 6px 12px; border-radius: 99px; background: rgba(0,0,0,.66);
    backdrop-filter: blur(10px); font-size: 12px; white-space: nowrap; pointer-events: none; display: none; }

  /* タイムライン */
  .timeline { flex: none; position: relative; background: var(--surface); border-top: 1px solid var(--hair); }
  .tl-head { height: 30px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 10px; }
  .tc { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--faint); }
  .tc b { color: var(--text); font-weight: 600; }
  .play { width: 40px; height: 30px; display: grid; place-items: center; }
  .tl-head .right { display: flex; justify-content: flex-end; }
  .tl-body { position: relative; height: 108px; }
  .labels { position: absolute; left: 0; top: 0; bottom: 0; width: 46px; z-index: 3; background: linear-gradient(90deg, var(--surface) 70%, transparent); pointer-events: none; }
  .labels div { position: absolute; left: 8px; display: flex; align-items: center; gap: 0; height: 22px; }
  .labels span { width: 26px; height: 22px; border-radius: 7px; display: grid; place-items: center; }
  .scroller { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; }
  .scroller::-webkit-scrollbar { display: none; }
  .wrap { position: relative; height: 100%; padding: 0 50vw; width: max-content; }
  .lanes { position: relative; height: 100%; }
  .row { position: absolute; left: 0; }
  .film { top: 6px; height: 44px; border-radius: 6px; overflow: hidden; background-image: var(--strip); background-repeat: no-repeat; }
  .scene { position: absolute; top: 6px; height: 44px; border-left: 2px solid rgba(0,0,0,.9); }
  .scene span { position: absolute; left: 4px; bottom: 3px; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.62);
    white-space: nowrap; max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis; }
  .scene.cur span { background: var(--c-video); color: #06202e; }
  .clip { position: absolute; top: 0; height: 20px; border-radius: 5px; font-size: 10px; line-height: 20px; padding: 0 6px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #111; opacity: .55; }
  .clip.cur { opacity: 1; }
  .clip.cmd { background: rgba(255,255,255,.1); color: var(--faint); }
  .clip.edited::after { content: "直"; position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; border-radius: 4px; background: #111; color: #fff; font-size: 9px; line-height: 14px; text-align: center; }
  .snd { position: absolute; top: 0; height: 20px; border-radius: 10px; padding: 0 7px 0 5px; display: flex; align-items: center; gap: 3px; font-size: 10px;
    background: rgba(255,204,77,.14); color: var(--c-sound); white-space: nowrap; }
  .snd.amb { background: rgba(255,204,77,.07); }
  .sel { outline: 2px solid #fff; outline-offset: 1px; opacity: 1 !important; }
  .dot { position: absolute; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); z-index: 2; pointer-events: none; }
  .playhead { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; z-index: 4; }

  /* 下: 今のコマにある物 → 選ぶと、できること */
  .dock { flex: none; background: var(--surface); border-top: 1px solid var(--hair); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .now { display: grid; grid-template-columns: 0.9fr 1.5fr 1fr; gap: 6px; }
  .card { height: 54px; border-radius: 12px; background: var(--raised); padding: 7px 9px; text-align: left; display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid transparent; min-width: 0; }
  .card:active { transform: scale(.98); }
  .card .k { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
  .card .v { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .n { margin-left: auto; font-size: 10px; color: var(--faint); font-weight: 600; }
  .card:disabled { opacity: .35; }
  .acts { display: none; }
  .dock.selected .now { display: none; }
  .dock.selected .acts { display: block; }
  .acts-head { display: flex; align-items: center; gap: 8px; height: 22px; margin-bottom: 8px; }
  .acts-head .badge { height: 20px; padding: 0 7px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #111; flex: none; }
  .acts-head .what { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts-head .x { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); flex: none; position: relative; }
  .acts-head .x::after { content: ""; position: absolute; inset: -8px; }
  .acts-row { display: flex; gap: 6px; }
  .act { flex: 1; height: 44px; border-radius: 12px; background: var(--raised); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .act.main { color: #111; }
  .act:active { transform: scale(.98); }
  .dock.mode .acts-row { display: none; }

  /* シート */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--raised); border-radius: 18px 18px 0 0;
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); transform: translateY(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    max-height: calc(78dvh - var(--kb, 0px)); display: flex; flex-direction: column; }
  .sheet textarea { flex: 0 1 auto; min-height: 64px; }
  .sheet.on { transform: none; bottom: var(--kb, 0px); }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.2); margin: 0 auto 8px; flex: none; }
  .sheet-head { display: flex; align-items: center; margin-bottom: 8px; flex: none; min-height: 32px; }
  .sheet-head h3 { flex: 1; margin: 0; font-size: 16px; font-weight: 700; text-align: left; }
  .xbtn { width: 44px; height: 44px; margin: -6px -10px -6px 0; display: grid; place-items: center; flex: none; color: var(--dim); }
  .xbtn span { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; }
  .xbtn:active span { background: rgba(255,255,255,.2); }
  .sheet-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 12px; flex: none; }
  .sheet-foot .left { margin-right: auto; }
  .confirm { height: 44px; padding: 0 18px 0 14px; border-radius: 12px; background: var(--accent); color: #1a1300; font-size: 15px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px; }
  .confirm:disabled { opacity: .35; cursor: default; }
  .confirm:not(:disabled):active { transform: scale(.98); }
  .ghost { height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; color: var(--dim); }
  .ghost:active { background: var(--hair); }
  .kbd-hint { display: none; font-size: 11px; color: var(--faint); }
  .kbd-hint kbd, .keys kbd { display: inline-block; min-width: 17px; height: 17px; line-height: 17px; padding: 0 4px; margin-right: 3px; border-radius: 4px; background: rgba(255,255,255,.08);
    color: var(--dim); font: inherit; font-size: 10px; font-weight: 700; text-align: center; }
  .sheet-body { overflow: auto; min-height: 0; overscroll-behavior: contain; }
  .tb { font-size: 14px; color: var(--dim); padding: 8px 4px; min-width: 56px; text-align: left; }
  .tb.go { color: var(--accent); font-weight: 700; text-align: right; }
  .ctxline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); margin-bottom: 10px; flex-wrap: wrap; flex: none; }
  .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #111; }
  textarea { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: #0c0c0d; border: 1px solid var(--hair); border-radius: 12px; padding: 12px; resize: none; outline: none; }
  .mincho { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; line-height: 1.75; }
  .before { font-size: 12px; color: var(--faint); margin-top: 8px; line-height: 1.6; white-space: pre-wrap; }
  .primary { height: 46px; border-radius: 12px; background: var(--accent); color: #1a1300; font-weight: 700; font-size: 15px; width: 100%; margin-top: 12px; flex: none; }
  .secondary { height: 44px; border-radius: 12px; background: rgba(255,255,255,.08); font-size: 14px; width: 100%; margin-top: 8px; flex: none; }
  .item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); align-items: flex-start; }
  .item:last-child { border-bottom: 0; }
  .thumb { width: var(--thumb-w); height: 60px; border-radius: 4px; flex: none; background-image: var(--strip); background-size: var(--thumb-bg); position: relative; }
  .thumb i { position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 5px; font-style: normal; font-size: 9px; font-weight: 700; color: #111; display: grid; place-items: center; }
  .item .main { flex: 1; min-width: 0; }
  .item .meta { font-size: 11px; color: var(--faint); margin-bottom: 3px; }
  .item .note { font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
  .item .old { font-size: 12px; color: var(--faint); text-decoration: line-through; margin-top: 3px; }
  .del { color: var(--faint); padding: 4px; }
  .empty { color: var(--faint); font-size: 13px; text-align: center; padding: 24px 12px; line-height: 1.7; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
  .kv dt { color: var(--faint); } .kv dd { margin: 0; }
  .label { font-size: 11px; color: var(--faint); letter-spacing: .06em; margin: 14px 0 6px; }
  .quote { font-size: 14px; line-height: 1.7; padding: 10px 12px; border-radius: 10px; background: #0c0c0d; white-space: pre-wrap; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 11px; line-height: 1.55; color: var(--dim); background: #0c0c0d; border-radius: 12px; padding: 12px; }
  .titlebtn { flex: 1; min-width: 0; text-align: center; line-height: 1.15; border-radius: 10px; padding: 2px 0; }
  .titlebtn:active { background: var(--hair); }
  .titlebtn small { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--dim); margin-top: 1px; }
  .editpill { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 5px 10px; border-radius: 99px; background: rgba(200,166,255,.92);
    color: #1b1030; font-size: 11px; font-weight: 600; white-space: nowrap; pointer-events: none; display: none; }
  .editpill.orig { background: rgba(255,255,255,.9); }
  .fork { position: absolute; top: 2px; width: 18px; height: 18px; margin-left: -9px; transform: rotate(45deg); border-radius: 4px; background: #fff; z-index: 3;
    box-shadow: 0 0 0 2px var(--surface); }
  .fork i { position: absolute; inset: 0; display: grid; place-items: center; transform: rotate(-45deg); font-style: normal; font-size: 10px; font-weight: 800; color: #111; }
  .chap { display: flex; gap: 12px; align-items: center; padding: 8px 0; position: relative; }
  .chap .thumb { width: var(--chap-w); height: 53px; background-size: var(--chap-bg); }
  .chap .main { flex: 1; min-width: 0; }
  .chap .nm { font-size: 14px; font-weight: 600; }
  .chap .tm { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .chap.cur .nm { color: var(--accent); }
  .chap::before { content: ""; position: absolute; left: 14px; top: -8px; bottom: -8px; width: 2px; background: rgba(255,255,255,.08); z-index: -1; }
  .mini { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 700; color: #111; }
  .forkcard { margin: 6px 0 6px 0; padding: 10px 12px; border-radius: 12px; background: #0c0c0d; border: 1px dashed rgba(255,255,255,.18); }
  .forkcard .q { font-size: 12px; color: var(--dim); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .routes { display: flex; gap: 6px; }
  .route { flex: 1; min-height: 44px; border-radius: 10px; background: var(--raised); padding: 6px 10px; text-align: left; }
  .route b { display: block; font-size: 13px; }
  .route span { font-size: 10px; color: var(--faint); }
  .route.on { background: #fff; color: #111; }
  .route.on span { color: #555; }
  .route.none { opacity: .55; }
  .example { font-size: 10px; font-weight: 700; color: #1a1300; background: var(--accent); border-radius: 3px; padding: 0 4px; }
  .scenenote { position: absolute; right: 10px; bottom: 10px; height: 38px; padding: 0 14px 0 11px; border-radius: 99px; display: none; align-items: center; gap: 6px;
    background: rgba(255,255,255,.94); color: #111; font-size: 13px; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 2; }
  .scenenote:active { transform: scale(.97); }
  .scenenote.on { display: inline-flex; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .playhere { height: 28px; padding: 0 10px 0 7px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.1);
    color: var(--text); font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .playhere svg { width: 18px; height: 18px; }
  .playhere:active { background: rgba(255,255,255,.2); }
  .toast { position: fixed; left: 50%; top: calc(52px + env(safe-area-inset-top)); transform: translate(-50%, -8px); padding: 8px 14px; border-radius: 99px;
    background: rgba(40,40,42,.94); backdrop-filter: blur(12px); font-size: 13px; z-index: 30; opacity: 0; transition: all .2s; pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ── 広い画面（幅 720 以上）。body の form-* / input-* は JS が matchMedia で付ける。スマホの形には何も効かせない ── */
  .bin, .insp, .ruler, .marks, .zoombox, .keys, .lbn, .tip { display: none; }
  body.wide .app { display: grid; grid-template-rows: 44px minmax(0, 1fr) auto; }
  body.form-three .app { grid-template-columns: 248px minmax(0, 1fr) 340px; grid-template-areas: "top top top" "bin view insp" "tl tl tl"; }
  body.form-three.wide-video .app { grid-template-columns: 216px minmax(0, 1fr) 300px; }
  body.form-two .app, body.form-portrait .app { grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "top top" "view insp" "tl tl"; }
  body.wide .top { grid-area: top; border-bottom: 1px solid var(--hair); }
  body.form-three #listBtn { visibility: hidden; }
  body.wide .preview { grid-area: view; min-height: 0; padding: 12px; }
  body.wide.wide-video .frame { aspect-ratio: var(--frame-ratio); height: auto; width: 100%; max-height: 100%; background: #0c0c0d; border-radius: 8px; }
  body.wide .timeline { grid-area: tl; }
  body.form-three .bin { grid-area: bin; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--hair); }
  body.wide .insp { grid-area: insp; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--hair); }
  .panel-h { flex: none; height: 32px; display: flex; align-items: center; padding: 0 12px; font-size: 11px; color: var(--faint); letter-spacing: .06em; border-bottom: 1px solid var(--hair); }
  .bin-body { flex: 1; min-height: 0; overflow: auto; padding: 2px 12px 12px; position: relative; z-index: 0; }
  .bin-body .chap .tm { flex-wrap: wrap; row-gap: 3px; }
  .bin-body .mini { white-space: nowrap; }
  .bin-body .flash { outline: 2px solid #fff; outline-offset: 2px; border-radius: 8px; }
  body.wide.input-mouse .keys { display: grid; flex: none; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 5px 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--hair); font-size: 11px; color: var(--faint); }
  .keys span { white-space: nowrap; }
  .keys kbd { background: var(--raised); }
  .insp .dock { flex: none; border-top: 0; padding: 10px 12px; background: none; border-bottom: 1px solid var(--hair); }
  .insp .now { grid-template-columns: 1fr; }
  .insp .card { height: auto; min-height: 52px; gap: 4px; }
  .insp .card .v { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.45; }
  .insp .acts-head { height: auto; align-items: flex-start; }
  .insp .acts-head .what { white-space: normal; line-height: 1.5; padding-top: 1px; }
  .insp .acts-row { flex-wrap: wrap; }
  .insp .act { flex: 1 1 40%; }
  .insp .sheet { position: static; transform: none; transition: none; display: none; z-index: auto; border-radius: 0; background: none; max-height: none;
    padding: 8px 12px 12px; border-bottom: 1px solid var(--hair); flex: 0 1 auto; min-height: 0; }
  .insp .sheet.on { display: flex; }
  .insp .grab { display: none; }
  .insp .sheet-head { margin-bottom: 8px; }
  .insp .sheet-head h3 { font-size: 14px; }
  .insp .textarea, .insp textarea { font-size: 15px; }
  body:not(.form-three) .insp:has(> .sheet.on) > .dock, body.form-three .insp:has(> .sheet.on:not(#listSheet)) > .dock { display: none; }
  .insp #listSheet.on { flex: 1 1 0; border-bottom: 0; }
  body.form-three #listSheet .xbtn { visibility: hidden; }
  body.wide.input-mouse .kbd-hint { display: inline-flex; align-items: center; }
  body.wide.input-mouse .item .del { opacity: 0; transition: opacity .12s; }
  body.wide.input-mouse .item:hover .del, body.wide.input-mouse .item .del[data-armed] { opacity: 1; }
  body.wide #exportSheet, body.wide #playSheet { left: 50%; right: auto; bottom: auto; top: 50%; width: min(640px, 90vw); max-height: 80vh; border-radius: 18px;
    transform: translate(-50%, -46%); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  body.wide #exportSheet.on, body.wide #playSheet.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  body.wide #exportSheet .grab, body.wide #playSheet .grab { display: none; }
  body.wide:not([data-open="exportSheet"]):not([data-open="playSheet"]) .scrim { display: none; }

  /* 広い画面のタイムライン: 上にルーラー（時刻と注釈のマーカー）、段は字が読める太さで固定 */

  if (!n) return;
  n.scrollIntoView({ block: "center", behavior: "smooth" });
  n.classList.add("flash"); setTimeout(() => n.classList.remove("flash"), 900);
}

function markItems() {
  return [...anns.map(a => ({ t: a.seconds, k: annTrack(a), a })), ...Object.keys(edits).map(ln => ({ t: lineStart(+ln) + .3, k: "script", ln: +ln }))];
}
function renderMarks() {
  const items = markItems();
  $("marks").innerHTML = items.map((m, i) => `<div class="mk" data-i="${i}" style="left:${m.t * PPS}px;background:${TRACK[m.k].c}"></div>`).join("");
  $("marks").querySelectorAll(".mk").forEach(n => n.onclick = () => { const m = items[+n.dataset.i]; seek(m.t); selectItem(m); });
}

const Z_MIN = 14, Z_MAX = 240;
const zoomToSlider = p => Math.round(100 * Math.log(p / Z_MIN) / Math.log(Z_MAX / Z_MIN));
function setZoom(p) {
  PPS = Math.max(Z_MIN, Math.min(Z_MAX, p));
  $("zoom").value = zoomToSlider(PPS);
  relayout();
}
$("zoom").addEventListener("input", e => setZoom(Z_MIN * Math.pow(Z_MAX / Z_MIN, e.target.value / 100)));
scroller.addEventListener("wheel", e => {
  if (!extras()) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) { setZoom(PPS * Math.exp(-e.deltaY * .01)); return; }
  scroller.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
}, { passive: false });
let pinch = null;
const span2 = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
scroller.addEventListener("touchstart", e => { if (form !== "phone" && e.touches.length === 2) pinch = { d: span2(e.touches), p: PPS }; }, { passive: true });
scroller.addEventListener("touchmove", e => { if (!pinch || e.touches.length !== 2) return; e.preventDefault(); setZoom(pinch.p * span2(e.touches) / pinch.d); }, { passive: false });
scroller.addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; });

// WhyNot: 戻し再生に playbackRate を使わない — video は負の速さを持てない
let shut = null;
function shuttle(dir) {
  setMode(null);
  if (shut && shut.dir === dir) shut.speed = Math.min(4, shut.speed * 2);
  else { stopShuttle(); shut = { dir, speed: 1 }; }
  toast(`${dir > 0 ? "▶" : "◀"} ${shut.speed}×`);
  if (dir > 0) { if (video.paused) togglePlay(); video.playbackRate = shut.speed; return; }
  if (sel) select(null); else video.pause();
  shut.last = performance.now();
  const tick = now => {
    if (!shut || shut.dir > 0) return;
    const t = Math.max(0, video.currentTime - (now - shut.last) / 1000 * shut.speed);
    shut.last = now; video.currentTime = t; follow(t); onTime(t);
    if (t <= 0) { stopShuttle(); return; }
    shut.raf = requestAnimationFrame(tick);
  };
  shut.raf = requestAnimationFrame(tick);
}
function stopShuttle() { if (!shut) return; cancelAnimationFrame(shut.raf); shut = null; video.playbackRate = 1; }
video.addEventListener("pause", () => { if (shut && shut.dir > 0) stopShuttle(); });

const stepFrames = n => { stopShuttle(); seek(Math.max(0, Math.min(TAPE.duration - .01, (frameOf(video.currentTime) + n) / TAPE.fps))); };
const stepSeconds = n => { stopShuttle(); seek(Math.max(0, Math.min(TAPE.duration - .01, video.currentTime + n))); };
function jumpLine(d) {
  stopShuttle();
  const t = video.currentTime, starts = TAPE.timeline.filter(r => r[1]).map(r => r[0]);
  const target = d > 0 ? starts.find(s => s > t + .06) : starts.filter(s => s < t - .3).pop();
  if (target === undefined) return;
  seek(target + .05);
  const ln = lineAt(target + .05);
  if (sel && sel.track === "script" && TAPE.lines[ln]) select({ track: "script", ln });
}
const ORDER = ["video", "script", "sound"];
function cycleTrack(d) {
  stopShuttle();
  let i = sel ? ORDER.indexOf(sel.track) : d > 0 ? -1 : ORDER.length;
  for (let n = 0; n < 3; n++) {
    i = (i + d + 3) % 3;
    const card = $("card" + ORDER[i][0].toUpperCase() + ORDER[i].slice(1));
    if (!card.disabled) { card.onclick(); return; }
  }
}
function noteHere() {
  stopShuttle(); video.pause();
  const t = video.currentTime;
  if (sel && sel.track === "script") { const l = TAPE.lines[sel.ln]; askNote("script", l.cmd ? { line: sel.ln, command: l.cmd } : { line: sel.ln }, null, t); return; }
  if (sel && sel.track === "sound") { const s = sel.sound; askNote("sound", { name: s.name, kind: s.kind, label: s.label, line: s.line }, null, s.t); return; }
  const s = sceneAt(t); askNote("scene", { id: s.id, name: s.name, from: s.t, to: sceneEnd(s) }, null);
}
function startMode(m) { stopShuttle(); if (!sel || sel.track !== "video") select({ track: "video" }); setMode(m); }
function cancelSomething() {
  if (mode) setMode(null); else if (openId) close(); else if (sel) select(null);
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
}
function saveShortcut() {
  if (openId === "noteSheet" || openId === "editSheet") { toast("先に付けるか閉じてください"); return; }
  if (openId === "exportSheet") { $("saveBtn").click(); return; }
  if ($("exportBtn").disabled) { toast("まだ書き出す物がありません"); return; }
  $("exportBtn").onclick(); $("saveBtn").focus();
}
const KEYS = {
  " ": () => { stopShuttle(); togglePlay(); },
  k: () => { stopShuttle(); video.pause(); },
  j: () => shuttle(-1), l: () => shuttle(1),
  ArrowLeft: e => e.shiftKey ? stepSeconds(-1) : stepFrames(-1),
  ArrowRight: e => e.shiftKey ? stepSeconds(1) : stepFrames(1),
  Home: () => { stopShuttle(); seek(0); }, End: () => { stopShuttle(); seek(TAPE.duration - .05); },
  "[": () => jumpLine(-1), "]": () => jumpLine(1),
  ArrowUp: () => cycleTrack(-1), ArrowDown: () => cycleTrack(1),
  n: noteHere, m: noteHere,
  e: () => { if (sel && sel.track === "script" && TAPE.lines[sel.ln].text) openEdit(sel.ln); else toast("台詞を選んでいる時に直せます（↑↓ で台本を選ぶ）"); },
  r: () => startMode("rect"), o: () => startMode("pick"),
  p: () => { if (TAPE.playUrl) $("playHereBtn").click(); }
};
addEventListener("keydown", e => {
  if (!extras()) return;
  // WhyNot: 変換中のキーを拾わない — Esc で変換を取り消したつもりがシートを閉じ、確定の Enter が付けるになる。Safari は確定のキーを isComposing 偽・keyCode 229 で送る
  if (e.isComposing || e.keyCode === 229) return;
  const mod = e.metaKey || e.ctrlKey, typing = e.target.tagName === "TEXTAREA" || (e.target.tagName === "INPUT" && e.target.type !== "range");
  if (mod && e.key === "Enter") { e.preventDefault(); if (openId === "noteSheet") $("noteSave").click(); else if (openId === "editSheet") $("editSave").click(); return; }
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); saveShortcut(); return; }
  if (e.key === "Escape") { e.preventDefault(); cancelSomething(); return; }
  if (typing || mod || e.altKey || e.target.type === "range") return;
  const fn = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!fn) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur();
  fn(e);
});

const tip = $("tip");
function tipFor(n) {
  if (n.classList.contains("clip")) {
    const ln = +n.dataset.ln, l = TAPE.lines[ln];
    if (l.cmd) return `<span class="m">演出 · ${yarn}:${ln}</span>\n${esc(l.cmd)}`;
    return `<span class="m"><b style="color:${WHO[l.who]}">${esc(l.who)}</b> · ${yarn}:${ln}${edits[ln] !== undefined ? " · 直した文章" : ""}</span>\n<span class="mincho">${esc(textOf(ln).replace(/／/g, "\n"))}</span>`;
  }
  if (n.classList.contains("snd")) { const s = TAPE.sounds[+n.dataset.i]; return `♪ ${esc(s.label)}\n<span class="m">${s.name} · ${s.kind === "ambience" ? "環境音" : "効果音"} · ${mmss(s.t)} · ${yarn}:${s.line}</span>`; }
  if (n.classList.contains("scene")) { const s = TAPE.scenes.find(x => x.id === n.dataset.id); return `${esc(s.name)}\n<span class="m">${mmss(s.t)} – ${mmss(sceneEnd(s))}</span>`; }
  if (n.classList.contains("mk")) {
    const m = markItems()[+n.dataset.i];
    if (m.a) return `<span class="m">${TRACK[m.k].name}: ${esc(label(m.a))} · ${mmss(m.t)}</span>\n${esc(m.a.note)}`;
    return `<span class="m">台本: 文章の直し · ${yarn}:${m.ln}</span>\n<span class="mincho">${esc(edits[m.ln].replace(/／/g, "\n"))}</span>`;
  }
  if (n.classList.contains("fork")) { const br = TAPE.branches[+n.dataset.i]; return `分岐: ${esc(br.question)}\n<span class="m">${br.routes.map(r => (r.here ? "✓ " : "") + esc(r.label)).join(" / ")}</span>`; }
  if (n.classList.contains("card") && !n.disabled) return esc(n.querySelector(".v").textContent);
  return "";
}
function placeTip(e) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 18;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
document.addEventListener("mouseover", e => {
  if (!extras()) return;
  const n = e.target.closest(".clip,.snd,.scene,.mk,.fork,.card"), html = n ? tipFor(n) : "";
  if (!html) { tip.classList.remove("on"); return; }
  tip.innerHTML = html; tip.classList.add("on"); placeTip(e);
});
document.addEventListener("mousemove", e => { if (tip.classList.contains("on")) placeTip(e); });
scroller.addEventListener("scroll", () => tip.classList.remove("on"));

applyTape(); applyForm();
setIcon(); buildTimeline(); refresh(); onTime(0);
fetch("kesshou.mp4").then(r => r.blob()).then(b => { video.src = URL.createObjectURL(b); }).catch(() => { video.src = "kesshou.mp4"; });
</script>
</body>
