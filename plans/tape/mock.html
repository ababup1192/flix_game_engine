<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>テープ（モック・広い画面）— 血鱗 序章</title>
<style>
  :root {
    --bg: #000; --surface: #111113; --raised: #1c1c1f; --hair: rgba(255,255,255,.08);
    --text: #f2f2f2; --dim: rgba(255,255,255,.6); --faint: rgba(255,255,255,.34);
    --accent: #ffcc4d;
    --c-video: #6cc4ff; --c-script: #c8a6ff; --c-sound: #ffcc4d;
    --witch: #c8a6ff; --girl: #ffb46b; --narr: #e6e6e6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }

  /* 上の帯 */
  .top { flex: none; height: 44px; display: flex; align-items: center; padding: 0 10px 0 4px; gap: 4px; }
  .iconbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; position: relative; }
  .iconbtn:active { background: var(--hair); }
  .count { position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: #fff; color: #000;
    font-size: 10px; font-weight: 700; display: grid; place-items: center; }
  .title { flex: 1; min-width: 0; text-align: center; line-height: 1.15; }
  .title b { font-size: 14px; font-weight: 600; }
  .title small { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .export { height: 30px; padding: 0 12px; border-radius: 99px; background: var(--accent); color: #1a1300; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .export:disabled { background: var(--raised); color: var(--faint); }
  .mock { font-size: 9px; font-weight: 700; color: #1a1300; background: var(--accent); border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 2px; }

  /* 動画 */
  .preview { flex: 1 1 auto; min-height: 120px; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 0 6px; }
  .frame { position: relative; height: 100%; aspect-ratio: var(--frame-ratio, auto); max-width: 100%; }
  .frame video, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame video { object-fit: contain; border-radius: 8px; }
  .frame canvas { touch-action: none; }
  .glyph { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%; background: rgba(0,0,0,.45);
    backdrop-filter: blur(8px); display: grid; place-items: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .glyph.on { opacity: 1; }
  .pill { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 6px 12px; border-radius: 99px; background: rgba(0,0,0,.66);
    backdrop-filter: blur(10px); font-size: 12px; white-space: nowrap; pointer-events: none; display: none; }

  /* タイムライン */
  .timeline { flex: none; position: relative; background: var(--surface); border-top: 1px solid var(--hair); }
  .tl-head { height: 30px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 10px; }
  .tc { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--faint); }
  .tc b { color: var(--text); font-weight: 600; }
  .play { width: 40px; height: 30px; display: grid; place-items: center; }
  .tl-head .right { display: flex; justify-content: flex-end; }
  .tl-body { position: relative; height: 108px; }
  .labels { position: absolute; left: 0; top: 0; bottom: 0; width: 46px; z-index: 3; background: linear-gradient(90deg, var(--surface) 70%, transparent); pointer-events: none; }
  .labels div { position: absolute; left: 8px; display: flex; align-items: center; gap: 0; height: 22px; }
  .labels span { width: 26px; height: 22px; border-radius: 7px; display: grid; place-items: center; }
  .scroller { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x; }
  .scroller::-webkit-scrollbar { display: none; }
  .wrap { position: relative; height: 100%; padding: 0 50vw; width: max-content; }
  .lanes { position: relative; height: 100%; }
  .row { position: absolute; left: 0; }
  .film { top: 6px; height: 44px; border-radius: 6px; overflow: hidden; background-image: var(--strip); background-repeat: no-repeat; }
  .scene { position: absolute; top: 6px; height: 44px; border-left: 2px solid rgba(0,0,0,.9); }
  .scene span { position: absolute; left: 4px; bottom: 3px; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.62);
    white-space: nowrap; max-width: calc(100% - 8px); overflow: hidden; text-overflow: ellipsis; }
  .scene.cur span { background: var(--c-video); color: #06202e; }
  .clip { position: absolute; top: 0; height: 20px; border-radius: 5px; font-size: 10px; line-height: 20px; padding: 0 6px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #111; opacity: .55; }
  .clip.cur { opacity: 1; }
  .clip.cmd { background: rgba(255,255,255,.1); color: var(--faint); }
  .clip.edited::after { content: "直"; position: absolute; right: 3px; top: 3px; width: 14px; height: 14px; border-radius: 4px; background: #111; color: #fff; font-size: 9px; line-height: 14px; text-align: center; }
  .snd { position: absolute; top: 0; height: 20px; border-radius: 10px; padding: 0 7px 0 5px; display: flex; align-items: center; gap: 3px; font-size: 10px;
    background: rgba(255,204,77,.14); color: var(--c-sound); white-space: nowrap; }
  .snd.amb { background: rgba(255,204,77,.07); }
  .sel { outline: 2px solid #fff; outline-offset: 1px; opacity: 1 !important; }
  .dot { position: absolute; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); z-index: 2; pointer-events: none; }
  .playhead { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; z-index: 4; }

  /* 下: 今のコマにある物 → 選ぶと、できること */
  .dock { flex: none; background: var(--surface); border-top: 1px solid var(--hair); padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .now { display: grid; grid-template-columns: 0.9fr 1.5fr 1fr; gap: 6px; }
  .card { height: 54px; border-radius: 12px; background: var(--raised); padding: 7px 9px; text-align: left; display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid transparent; min-width: 0; }
  .card:active { transform: scale(.98); }
  .card .k { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
  .card .v { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .n { margin-left: auto; font-size: 10px; color: var(--faint); font-weight: 600; }
  .card:disabled { opacity: .35; }
  .acts { display: none; }
  .dock.selected .now { display: none; }
  .dock.selected .acts { display: block; }
  .acts-head { display: flex; align-items: center; gap: 8px; height: 22px; margin-bottom: 8px; }
  .acts-head .badge { height: 20px; padding: 0 7px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #111; flex: none; }
  .acts-head .what { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts-head .x { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); flex: none; position: relative; }
  .acts-head .x::after { content: ""; position: absolute; inset: -8px; }
  .acts-row { display: flex; gap: 6px; }
  .act { flex: 1; height: 44px; border-radius: 12px; background: var(--raised); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .act.main { color: #111; }
  .act:active { transform: scale(.98); }
  .dock.mode .acts-row { display: none; }

  /* シート */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--raised); border-radius: 18px 18px 0 0;
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); transform: translateY(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    max-height: calc(78dvh - var(--kb, 0px)); display: flex; flex-direction: column; }
  .sheet textarea { flex: 0 1 auto; min-height: 64px; }
  .sheet.on { transform: none; bottom: var(--kb, 0px); }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.2); margin: 0 auto 8px; flex: none; }
  .sheet-head { display: flex; align-items: center; margin-bottom: 8px; flex: none; min-height: 32px; }
  .sheet-head h3 { flex: 1; margin: 0; font-size: 16px; font-weight: 700; text-align: left; }
  .xbtn { width: 44px; height: 44px; margin: -6px -10px -6px 0; display: grid; place-items: center; flex: none; color: var(--dim); }
  .xbtn span { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; }
  .xbtn:active span { background: rgba(255,255,255,.2); }
  .sheet-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 12px; flex: none; }
  .sheet-foot .left { margin-right: auto; }
  .confirm { height: 44px; padding: 0 18px 0 14px; border-radius: 12px; background: var(--accent); color: #1a1300; font-size: 15px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px; }
  .confirm:disabled { opacity: .35; cursor: default; }
  .confirm:not(:disabled):active { transform: scale(.98); }
  .ghost { height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; color: var(--dim); }
  .ghost:active { background: var(--hair); }
  .kbd-hint { display: none; font-size: 11px; color: var(--faint); }
  .kbd-hint kbd, .keys kbd { display: inline-block; min-width: 17px; height: 17px; line-height: 17px; padding: 0 4px; margin-right: 3px; border-radius: 4px; background: rgba(255,255,255,.08);
    color: var(--dim); font: inherit; font-size: 10px; font-weight: 700; text-align: center; }
  .sheet-body { overflow: auto; min-height: 0; overscroll-behavior: contain; }
  .tb { font-size: 14px; color: var(--dim); padding: 8px 4px; min-width: 56px; text-align: left; }
  .tb.go { color: var(--accent); font-weight: 700; text-align: right; }
  .ctxline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); margin-bottom: 10px; flex-wrap: wrap; flex: none; }
  .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #111; }
  textarea { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: #0c0c0d; border: 1px solid var(--hair); border-radius: 12px; padding: 12px; resize: none; outline: none; }
  .mincho { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; line-height: 1.75; }
  .before { font-size: 12px; color: var(--faint); margin-top: 8px; line-height: 1.6; white-space: pre-wrap; }
  .primary { height: 46px; border-radius: 12px; background: var(--accent); color: #1a1300; font-weight: 700; font-size: 15px; width: 100%; margin-top: 12px; flex: none; }
  .secondary { height: 44px; border-radius: 12px; background: rgba(255,255,255,.08); font-size: 14px; width: 100%; margin-top: 8px; flex: none; }
  .item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); align-items: flex-start; }
  .item:last-child { border-bottom: 0; }
  .thumb { width: var(--thumb-w); height: 60px; border-radius: 4px; flex: none; background-image: var(--strip); background-size: var(--thumb-bg); position: relative; }
  .thumb i { position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 5px; font-style: normal; font-size: 9px; font-weight: 700; color: #111; display: grid; place-items: center; }
  .item .main { flex: 1; min-width: 0; }
  .item .meta { font-size: 11px; color: var(--faint); margin-bottom: 3px; }
  .item .note { font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
  .item .old { font-size: 12px; color: var(--faint); text-decoration: line-through; margin-top: 3px; }
  .del { color: var(--faint); padding: 4px; }
  .empty { color: var(--faint); font-size: 13px; text-align: center; padding: 24px 12px; line-height: 1.7; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
  .kv dt { color: var(--faint); } .kv dd { margin: 0; }
  .label { font-size: 11px; color: var(--faint); letter-spacing: .06em; margin: 14px 0 6px; }
  .quote { font-size: 14px; line-height: 1.7; padding: 10px 12px; border-radius: 10px; background: #0c0c0d; white-space: pre-wrap; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 11px; line-height: 1.55; color: var(--dim); background: #0c0c0d; border-radius: 12px; padding: 12px; }
  .titlebtn { flex: 1; min-width: 0; text-align: center; line-height: 1.15; border-radius: 10px; padding: 2px 0; }
  .titlebtn:active { background: var(--hair); }
  .titlebtn small { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--dim); margin-top: 1px; }
  .editpill { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); padding: 5px 10px; border-radius: 99px; background: rgba(200,166,255,.92);
    color: #1b1030; font-size: 11px; font-weight: 600; white-space: nowrap; pointer-events: none; display: none; }
  .editpill.orig { background: rgba(255,255,255,.9); }
  .fork { position: absolute; top: 2px; width: 18px; height: 18px; margin-left: -9px; transform: rotate(45deg); border-radius: 4px; background: #fff; z-index: 3;
    box-shadow: 0 0 0 2px var(--surface); }
  .fork i { position: absolute; inset: 0; display: grid; place-items: center; transform: rotate(-45deg); font-style: normal; font-size: 10px; font-weight: 800; color: #111; }
  .chap { display: flex; gap: 12px; align-items: center; padding: 8px 0; position: relative; }
  .chap .thumb { width: var(--chap-w); height: 53px; background-size: var(--chap-bg); }
  .chap .main { flex: 1; min-width: 0; }
  .chap .nm { font-size: 14px; font-weight: 600; }
  .chap .tm { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; margin-top: 2px; display: flex; gap: 6px; align-items: center; }
  .chap.cur .nm { color: var(--accent); }
  .chap::before { content: ""; position: absolute; left: 14px; top: -8px; bottom: -8px; width: 2px; background: rgba(255,255,255,.08); z-index: -1; }
  .mini { display: inline-flex; align-items: center; height: 16px; padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 700; color: #111; }
  .scriptrow { display: flex; align-items: center; gap: 8px; margin: 16px 0 4px; }
  .scriptrow .label { flex: 1; margin: 0; }
  .scriptdl { height: 28px; padding: 0 10px; border-radius: 99px; background: rgba(255,255,255,.1); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .scriptdl:active { background: rgba(255,255,255,.2); }
  .modes { flex: none; display: inline-flex; height: 30px; padding: 2px; border-radius: 99px; background: var(--raised); }
  .modes button { padding: 0 11px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--dim); }
  .modes button.on { background: #fff; color: #111; }
  .gview { display: none; }
  body.mode-graph .gview { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  body.mode-graph:not(.wide) .gview { position: fixed; inset: 0; z-index: 25; padding-top: env(safe-area-inset-top); }
  body.wide.mode-graph .gview { grid-area: view; }
  body.wide.mode-graph .preview { display: none; }
  .gv-head { flex: none; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--hair); }
  .gv-head .ttl { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gv-head .ttl small { margin-left: 6px; font-size: 11px; font-weight: 400; color: var(--faint); }
  .zb { width: 30px; height: 30px; border-radius: 99px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 700; display: grid; place-items: center; }
  .zb.fit { width: auto; padding: 0 10px; font-size: 12px; }
  body.wide .gv-head .xbtn { display: none; }
  .gwrap { flex: 1 1 auto; min-height: 0; overflow: auto; background: #0c0c0d; overscroll-behavior: contain; touch-action: pan-x pan-y; }
  .gwrap svg { display: block; margin: 0 auto; }
  .gwrap marker path { fill: rgba(255,255,255,.4); }
  .gbox { cursor: pointer; }
  .gbox rect { fill: var(--raised); stroke: rgba(255,255,255,.18); stroke-width: 1.5; }
  .gbox.here rect { fill: #24303a; stroke: rgba(108,196,255,.55); }
  .gbox.root rect { stroke: var(--c-video); }
  .gbox.end rect { stroke: var(--accent); }
  .gbox.lost rect { stroke: #ff7a59; stroke-dasharray: 4 3; }
  .gbox.cur rect { stroke: #fff; stroke-width: 2.5; }
  .gbox.pick rect { stroke: var(--accent); stroke-width: 4; }
  .gbox .t { font-size: 12px; font-weight: 600; fill: var(--text); }
  .gbox .i { font-size: 9px; fill: var(--faint); text-anchor: end; }
  .gbox .s { font-size: 11px; fill: var(--faint); }
  .gbox .b { font-size: 11px; fill: var(--c-script); }
  .gbox .tm { font-size: 11px; font-weight: 700; fill: var(--c-video); text-anchor: end; }
  .gbox.end .b { fill: var(--accent); font-weight: 700; }
  .gedge path { fill: none; stroke: rgba(255,255,255,.4); stroke-width: 1.4; }
  .gedge.back path { stroke-dasharray: 5 4; }
  .gedge.choice path { stroke: var(--c-script); }
  .gedge.hot path { stroke: var(--accent); stroke-width: 2.6; }
  .gedge text { font-size: 11px; fill: var(--c-script); text-anchor: middle; paint-order: stroke; stroke: #0c0c0d; stroke-width: 4px; }
  .npanel { display: none; }
  body.mode-graph .npanel { display: block; }
  body.mode-graph:not(.wide) .npanel { flex: none; max-height: 42%; overflow: auto; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); background: var(--surface); }
  .insp .npanel { flex: 1 1 0; min-height: 0; overflow: auto; padding: 10px 12px 12px; }
  body.mode-graph .insp > .dock, body.mode-graph .insp > #listSheet { display: none !important; }
  .npanel .nm { font-size: 14px; font-weight: 600; word-break: break-word; }
  .npanel .nm small { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; color: var(--faint); }
  .gacts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .gact { height: 30px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; background: rgba(255,255,255,.1); color: var(--text);
    font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .gact.go { background: var(--c-video); color: #04121c; }
  .gact:active { opacity: .8; }
  .gnone { font-size: 11px; color: var(--faint); }
  .glinks .label { margin: 10px 0 4px; }
  .glink { display: block; width: 100%; text-align: left; padding: 6px 8px; margin-top: 4px; border-radius: 8px; background: rgba(255,255,255,.06); font-size: 12px; line-height: 1.45; }
  .glink b { color: var(--c-script); font-weight: 700; }
  .glink small { margin-left: 6px; font-size: 10px; color: var(--faint); }
  .glink:active { background: rgba(255,255,255,.14); }
  .glink.gone { color: #ff7a59; cursor: default; }
  .grows { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; line-height: 1.5; }
  .grows li { display: grid; grid-template-columns: 30px 1fr; gap: 6px; padding: 2px 0; border-top: 1px solid var(--hair); }
  .grows .ln { color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }
  .grows li.here { cursor: pointer; }
  .grows li.here .ln { color: var(--c-video); font-weight: 700; }
  .grows span { word-break: break-word; }
  .grows .k-stage { color: #7aa7f0; } .grows .k-actor { color: #d68cc4; } .grows .k-sound { color: #5cc4a4; } .grows .k-fx { color: #f08a66; }
  .grows .k-wait, .grows .k-other { color: var(--faint); } .grows .k-end { color: var(--accent); font-weight: 700; } .grows .k-gate { color: #a98bf0; }
  .grows .k-choice, .grows .k-jump { color: var(--accent); }
  .scenenote { position: absolute; right: 10px; bottom: 10px; height: 38px; padding: 0 14px 0 11px; border-radius: 99px; display: none; align-items: center; gap: 6px;
    background: rgba(255,255,255,.94); color: #111; font-size: 13px; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,.35); z-index: 2; }
  .scenenote:active { transform: scale(.97); }
  .scenenote.on { display: inline-flex; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .playhere { height: 28px; padding: 0 10px 0 7px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.1);

  script: "\u003c!-- yarn: 3b75d11f5427 --\u003e\n# シナリオ原稿 — 血と鱗と素敵なモノ\n\n〔〕は演出の注釈、（）は間。字は自由に直してください。演出を足したい・変えたい所は〔〕で書けば、AI がシナリオへ反映します。\n話し手の名前は「」の前。地の文は名前を書きません。改行はそのまま画面の改行です（Markdown のプレビューでは行がつながるので、テキストのまま読んでください）。ルビは ｜字《よみ》。\n\n## 1「おや、あんた海の者でな…」　〔Lair〕\n\n〔se splash〕（間 1.2 秒）〔ambience sea〕〔暗闇から海の底が現れる（1.8）〕（間 0.6 秒）〔少女が左上へ沈んでくる〕〔少女の口から泡〕（間 1.8 秒）〔魔女が右下に現れる〕（間 1.3 秒）\n魔女「おや、あんた海の者でないね。\n　　　そんなに空気の泡を吐いてりゃ\n　　　すぐ分かるさ」\n\n〔se bubble〕〔字を出さずに話す（girl）〕（間 1.7 秒）\n魔女「なになに……\n　　　海の魔女の力が借りたくて、\n　　　息苦しい中ここまで？\n　　　そりゃあご苦労なことだ」\n\n魔女「それで、願いってのは？\n　　　……はあ。魂を捨てたい、ね。\n　　　人間様にしちゃ珍しい願い事だ」\n\n魔女「ま、不可能じゃないよ。\n　　　ただし対価に\n　　　今あんたの一番大事なモノを……\n　　　え、そんなもの存在しない？」\n\n魔女「……」\n\n魔女「ああもう。分かった、分かった。\n　　　だからそんな目で見るんじゃないよ」\n\n魔女「こいつを持っていきな」\n\n〔小瓶・ナイフを手に持ち、文字の奥に大きく映す〕〔se glass〕（間 1.6 秒）\n魔女「この器を血で満たし、\n　　　ついでに魂の代わりに\n　　　お前を動かしてくれる核を\n　　　何か一つ、入れるんだ。\n　　　それを今の心臓とそっくり取り換えりゃ、\n　　　魂を失くしても生きていけるってわけさ」\n\n〔小瓶・ナイフを手に持ち、文字の奥に大きく映す〕〔se blade〕（間 1.6 秒）\n魔女「ほら、このナイフもサービスだ。\n　　　血を集めるのに便利だろうし、\n　　　使い続ければ手に馴染むだろうさ」\n\n〔小瓶・ナイフを手に持ち、文字の奥に大きく映す〕\n魔女「ただし、中身を集めている間は、\n　　　海から上がるんじゃないよ。\n　　　私の魔法が解けて、\n　　　器が駄目になっちまうからね」\n\n魔女「それだと息が続かない？\n　　　泣き言をいうんじゃないよ。\n　　　水中でも、息継ぎする手段はあるものさ。\n　　　それくらいは自分で探しな」\n\n魔女「さあ、お行き。\n　　　魂を失くして新しい生を歩むか、\n　　　死んで魂ごと失くしちまうか。\n　　　それはあんたの努力次第だ。\n　　　それで、あんたの目的が果たされたら。\n　　　その時に余った心臓と魂を\n　　　対価として貰うことにしよう」\n\n〔clear〕〔去る〕（間 1.2 秒）\n【↑ 上へ払う】　案内「上方向スワイプでページ切替」\n〔少女が沈む（40）〕〔se sink〕\nこうして少女は\n魂の代わりになるモノを得るために、\n海での暮らしを始めました\n\n【↑ 上へ払う】\n〔少女が沈む（40）〕（間 1.0 秒）〔黒へ落とす（1.0）〕（間 1.0 秒）\n→ 2「〔汎用海中〕」 へ\n\n## 2「〔汎用海中〕」　〔Deep〕\n\u003e 汎用海中: 払うたびに海が暗くなり、少女が 1 段ずつ沈み、回想のスチルが決まった所に 1 枚ずつ浮かび上がって入れ替わる。4 回目でスチルが消え、影と目、暗転\n\n〔scene deep〕〔bg deep deep0 1.6〕〔ambience deep〕〔暗闇から海の底が現れる（0.6）〕〔clear〕（間 1.0 秒）\n【↑ 上へ払う】　案内「上方向スワイプでページ切替」\n〔bg deep deep1 0.8〕〔vision fish〕〔se bubble〕（間 1.6 秒）\n【↑ 上へ払う】\n〔bg deep deep2 0.8〕〔vision drowned〕〔se bubble〕（間 1.6 秒）\n【↑ 上へ払う】\n〔bg deep deep3 0.8〕〔vision plant〕〔se bubble〕（間 1.6 秒）\n【↑ 上へ払う】\n〔vision clear〕〔bg deep deep4 1.2〕〔se rumble〕〔shadow 2.4〕（間 2.6 秒）〔eye on〕〔se eye〕（間 2.4 秒）〔黒へ落とす（1.5）〕（間 1.6 秒）〔eye off〕〔ambience off〕（間 0.8 秒）\n→ 3「あらあら、珍しいお客様…」 へ\n\n## 3「あらあら、珍しいお客様…」　〔Whale〕\n\u003e 白鯨の住処: タップで会話。地の文を出したまま日々と回想のスチルが流れ、暗転して白鯨が横たわり、目を閉じ、泡が止まり、遺体になる\n\n〔scene whale〕〔bg whale clear 0〕〔ambience whale〕〔暗闇から海の底が現れる（2.0）〕〔clear〕（間 1.8 秒）〔se call〕\n白鯨「あらあら、珍しいお客様だわ。\n　　　海の上の子、人間さんね」\n\n白鯨「年を取りすぎたせいか、\n　　　この辺りからすっかり\n　　　動けなくなってしまってね。\n　　　だから、お客様が来るのが嬉しくって」\n\n白鯨「人間のお嬢さん、\n　　　もしよろしければ、\n　　　しばらく話し相手に\n　　　なってくれないかしら」\n\n〔se bubble〕〔字を出さずに話す（girl）〕（間 1.7 秒）\n白鯨の傍は快適で、\n少女は白鯨と長い間、\n穏やかな時を過ごしました\n\n〔days 3〕（間 2.6 秒）〔vision tea〕（間 1.8 秒）〔vision meal〕（間 2.2 秒）〔vision clear〕\nけれど、それも長くは続きませんでした\n\n〔clear〕〔黒へ落とす（1.0）〕（間 1.1 秒）〔whale lying 0〕〔暗闇から海の底が現れる（1.2）〕（間 1.2 秒）\n白鯨「私ね、きっと近いうちに死んでしまうの」\n\n白鯨「そのことは受け入れてはいるのよ。\n　　　もう十分に長生きしたのだから」\n\n白鯨「でも、その時が来る前に\n　　　せっかく出会えたあなたに、\n　　　なにかお礼がしたいと思ったの」\n\n白鯨「けれど、生憎とこんな身体だから、\n　　　何も用意できていなくて」\n\n白鯨「以前、この辺りで見つけた綺麗な石を\n　　　大事に取っておいたはずなのだけれど、\n　　　それも見当たらなくて」\n\n白鯨「あなたに似合うと思ったのに、残念だわ」\n\n〔breath〕〔se exhale〕〔whale closing 5.0〕\n白鯨「ねえ人間さん。\n　　　私がいなくなったら\n　　　私の財産を好きにしていいわ。\n　　　もっとも、今差し出せるものなんて\n　　　この身一つしかないのだけれど。\n　　　本当、あの綺麗な石が\n　　　ここに残っていたらよかったのに」\n\n〔whale closed〕\n白鯨「…………。ごめんなさい、少し休むわ。\n　　　なんだからとても眠いの……」\n\n〔breath〕〔se exhale〕〔whale still〕〔ambience still〕\n白鯨「…………」\n\n〔whale corpse 1.5〕（間 1.5 秒）\n→ 4「白鯨は動かなくなりまし…」 へ\n\n## 4「白鯨は動かなくなりまし…」　〔Corpse〕\n\u003e 遺体: 下へ払うたびにナイフで刺し、血飛沫と赤い線、瓶に血が溜まる。最後に腹を割くと光る物が転がり出る\n\n〔scene corpse〕〔bg whale clear 0〕〔ambience still〕〔暗闇から海の底が現れる（0.6）〕\n白鯨は動かなくなりました。\n\n〔clear〕\n【↓ 下へ払う】\n〔stab〕〔se stab〕〔wound 1〕（間 1.0 秒）〔vial 1〕〔se fill〕\n白鯨にナイフを突き立てましたが、\n反応はありません。\nナイフを深く突き刺した箇所から\nどろりと赤い血が流れだしていきます。\n\n【↓ 下へ払う】\n〔stab〕〔se stab〕〔wound 2〕〔vial 2〕〔se fill〕（間 1.0 秒）\n【↓ 下へ払う】\n〔stab〕〔se stab〕〔wound 3〕〔vial 4〕〔se fill〕（間 1.0 秒）\n流れ出る大量の血が、\n器に満ちていきます。\n\n【↓ 下へ払う】　案内「鯨の腹を割く」\n〔stab〕〔se slash〕〔wound belly〕〔roll〕〔se roll〕（間 1.4 秒）\n切り開いた内蔵から\n小さな光るモノが転がり落ちました。\n美しく磨かれた、大きな宝石でした\n\n→ 5「宝石は海流にさらわれ」 へ\n\n## 5「宝石は海流にさらわれ」　〔Fork〕\n\u003e 分かれ道（頭の台詞でオートセーブ）: 左へ払えば宝石を拾いに（案内は指を置き始める右側）、下へ払えば解体\n\n〔scene fork〕〔bg whale clear 0〕〔ambience still〕〔暗闇から海の底が現れる（0.8）〕〔clear〕\n宝石は海流にさらわれ\nどこかへと転がって行きます……\n\n◆ 選ぶ\n　・宝石を拾いに行く（←）\n　　→ 6「〔宝石の場所〕」 へ\n　・解体する（↓）\n　　〔stab〕〔wound all〕〔se slash〕（間 1.4 秒）\n　　→ 8「少女は手を止めることな…」 へ\n\n## 6「〔宝石の場所〕」　〔Gem〕\n\u003e 宝石の場所: 住処から右へ送った先。宝石をタップして瓶に入れる（大写し）\n\n〔scene gem〕〔bg gem clear 1.8 pan〕〔ambience still〕〔暗闇から海の底が現れる（0.8）〕〔clear〕（間 1.8 秒）\n【● タップ（gem を）】　案内「宝石をタップ」\n〔se pick〕〔vial gem〕（間 1.6 秒）\n→ 7「宝石を拾って器に入れま…」 へ\n\n## 7「宝石を拾って器に入れま…」　〔GemEnd〕\n\u003e 「宝石」END: 拾った地の文の後に暗転と札とスチル。結びの地の文は段落ごとに頁を改める\n\n〔scene gem_end〕〔bg gem clear 0〕〔ambience still〕〔暗闇から海の底が現れる（0.8）〕〔clear〕\n宝石を拾って器に入れました。\nこの宝石は、\n器の核にできるかもしれません\n\n血も核も揃ったので、\n少女は魔女の元へ戻ることにしました。\nこれできっと彼女の願いは叶うでしょう\n\n〔clear〕〔end gem〕（間 3.2 秒）〔clear〕\nあるところに、\n元は人間だった人魚がおりました。\nその人魚は光り輝く\n透き通るモノが大好きで。\n\n〔clear〕\n海底や船の残骸、\n人間の死体などを探しては、\nキラキラ光る宝石や飾り物を\n漁って集めていました。\n美しく磨かれたそれらの価値も、\nその品々にこめられた思いも\n素晴らしい技術も\n人魚にはよく分かりません。\n知ったところで意味が無いのです。\n\n〔clear〕\n美しく輝く宝石さえあれば、\n心が歓びを感じる。\nただそれだけが\n人魚の生きる理由であったのです。\nそうして、ただ心の求めるままに。\n\n〔clear〕\n人魚はその長い長い\n生涯全部を費やして、\nただ光り輝くモノを\n集め続けるのです……。\n\n◆ 選ぶ\n　・タイトルへ戻る\n　　■ おわり\n　・分岐まで戻る\n　　〔黒へ落とす（0.8）〕（間 0.9 秒）\n　　→ 5「宝石は海流にさらわれ」 へ\n\n## 8「少女は手を止めることな…」　〔Dissect〕\n\u003e 解体（全体の赤い線は Fork の払いで入る）: 鯨が消えて骨が残る\n\n〔scene dissect〕〔bg whale clear 0〕〔ambience still〕〔暗闇から海の底が現れる（0.8）〕〔clear〕\n少女は手を止めることなく、\n大量の肉を\n少しずつ丁寧に切り分けていきます。\n\n〔whale off 1.6〕（間 1.6 秒）\nそうしてあらかた切り刻んだ後\n\n〔whale bones 1.2〕（間 1.2 秒）\n→ 9「肉を削がれ海水に洗われ…」 へ\n\n## 9「肉を削がれ海水に洗われ…」　〔Bones〕\n\u003e 骨（頭の台詞でオートセーブ）: 骨をタップすれば瓶に骨の欠片、上へ払えば立ち去る\n\n〔scene bones〕〔bg whale clear 0〕〔ambience still〕〔暗闇から海の底が現れる（0.8）〕〔clear〕\n肉を削がれ海水に洗われた大きな骨が、\n宝石のようにきらめいて見えました\n\n◆ 選ぶ\n　・骨をタップ（●）\n　　〔se bone〕〔vial bone〕（間 1.6 秒）\n　　→ 10「鯨の骨を少し削って器に…」 へ\n　・立ち去る（↑）\n　　→ 11「安らげる場所はありまし…」 へ\n\n## 10「鯨の骨を少し削って器に…」　〔BoneEnd〕\n\u003e 「骨」END\n\n〔scene bone_end〕〔bg whale clear 0〕〔ambience still〕〔暗闇から海の底が現れる（0.8）〕〔clear〕\n鯨の骨を少し削って器に入れました。\nこの宝石は、\n器の核にできるかもしれません\n\n血も核も揃ったので、\n少女は魔女の元へ戻ることにしました。\nこれできっと彼女の願いは叶うでしょう\n\n〔clear〕〔end bone〕（間 3.2 秒）〔clear〕\nあるところに、\n元は人間だった人魚がおりました。\n\n〔clear〕\nその人魚は\n死に瀕した生命を見つけては、\n最期まで側にいます。\n\n〔clear〕\nやがてその生命が死ぬと、\n人魚はその死者を丁寧に解体します。\n\n〔clear〕\nその肉体の中身の隅々、肉の一片まで。\nその姿を全てを記憶し、\nそれからその肉体を海へ還すために。\n\n〔clear〕\n人魚はそうやって、\n死者を弔うことが生き甲斐でした。\nけれどそこに死者への悲しみや\n憐れみがあるわけではありません。\n\n〔clear〕\nそうしなければいけない、と。\nその心に刻まれているから、\nそうしているだけなのです……。\n\n◆ 選ぶ\n　・タイトルへ戻る\n　　■ おわり\n　・分岐まで戻る\n　　〔黒へ落とす（0.8）〕（間 0.9 秒）\n　　→ 9「肉を削がれ海水に洗われ…」 へ\n\n## 11「安らげる場所はありまし…」　〔Leave〕\n\u003e 立ち去る: 少女は画面の下へ消え、「つづく」（続きの話へつながる結末なので、分岐へは戻さずタイトルへだけ）\n\n〔scene leave〕〔bg whale clear 0〕〔ambience still〕〔暗闇から海の底が現れる（0.8）〕〔clear〕\n安らげる場所はありました。\nそれは無くなってしまっても、\n必要なモノは遺されました。\n\n〔clear〕\nけれどまだ、\n少女の望む核は見つかりません。\n\n〔clear〕\n魂の代わりになるという\n『それ』を求めて、\n彼女はまだまだ海の中を\nさまようようです――。\n\n〔少女が沈む（900 3.5）〕〔se sink〕（間 3.5 秒）〔clear〕〔end leave〕（間 2.4 秒）\n◆ 選ぶ\n　・タイトルへ戻る\n　　■ おわり\n\n"
};

// 注釈は 3 つの帯のどれかに付く。帯の色・絵・名前を 1 か所で決め、タイムライン・下の札・一覧・書き出しが同じ物を使う

};

  play: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',

  listen: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>',
  trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>'
};
const WHO = { "魔女": "var(--witch)", "少女": "var(--girl)", "地の文": "var(--narr)" };

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d"), scroller = $("scroller"), dock = $("dock");
let PPS = 56;
const KEY = "tape4:" + TAPE.game + ":" + TAPE.commit;
let anns = [], edits = {};
try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); anns = s.anns || []; edits = s.edits || {}; } catch {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ anns, edits })); } catch {} };

let sel = null;      // 選んでいる物: { track, ... }
let mode = null;     // "rect" | "pick"（映像を選んだ後の、画面の上での操作）
let drag = null, pending = null, editing = null;

const frameOf = t => Math.round(t * TAPE.fps);
const atTime = (rows, t) => { let v = rows[0][1]; for (const [s, x] of rows) if (t >= s - 1e-6) v = x; return v; };
const sceneAt = t => { let s = TAPE.scenes[0]; for (const x of TAPE.scenes) if (t >= x.t - 1e-6) s = x; return s; };
const sceneEnd = s => { const i = TAPE.scenes.indexOf(s); return i + 1 < TAPE.scenes.length ? TAPE.scenes[i + 1].t : TAPE.duration; };
const lineAt = t => atTime(TAPE.timeline, t);
const lineStart = ln => TAPE.timeline.find(r => r[1] === ln)[0];
const textOf = ln => edits[ln] ?? (TAPE.lines[ln] || {}).text;
const probesAt = t => Object.fromEntries(Object.entries(TAPE.probes).map(([k, r]) => [k, atTime(r, t)]));
const objectsAt = t => TAPE.objects.filter(o => t >= o.from && t < o.to);
const soundsIn = s => TAPE.sounds.filter(x => x.t >= s.t && x.t < sceneEnd(s));
const soundNear = t => { const s = sceneAt(t), list = soundsIn(s); return list.reduce((b, x) => (!b || Math.abs(x.t - t) < Math.abs(b.t - t) ? x : b), null); };
const yarn = TAPE.yarn.split("/").pop();
const mmss = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const flat = s => s.replace(/／/g, " ");
const THUMB_W = Math.round(60 * TAPE.strip.w / TAPE.strip.h), CHAP_W = Math.round(53 * TAPE.strip.w / TAPE.strip.h);
const thumbPos = t => `${-Math.min(TAPE.strip.count - 1, Math.floor(t * TAPE.stripPerSec)) * THUMB_W}px 0`;
function toast(m) { const e = $("toast"); e.textContent = m; e.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("on"), 1800); }
const scriptRef = ln => { if (!ln) return null; const l = TAPE.lines[ln] || {};
  return l.cmd ? { file: TAPE.yarn, node: TAPE.node, line: ln, command: l.cmd } : { file: TAPE.yarn, node: TAPE.node, line: ln, speaker: TAPE.speaker[l.who] ?? l.who, text: textOf(ln) }; };
const annTrack = a => a.kind === "sound" ? "sound" : a.kind === "script" ? "script" : "video";

// ── タイムライン ──
function buildTimeline() {
  layoutTimeline();
  ["video", "script", "sound"].forEach(k => { const lb = $("lb" + k[0].toUpperCase() + k.slice(1)); lb.innerHTML = SVG[k](TRACK[k].hex); lb.style.background = TRACK[k].hex + "22"; });
  document.querySelectorAll("[data-icon]").forEach(i => i.outerHTML = SVG[i.dataset.icon](TRACK[i.dataset.icon].hex));
  renderTracks(); renderForks();
}
function layoutTimeline() {
  const W = TAPE.duration * PPS, TILE = PPS / TAPE.stripPerSec, wide = form !== "phone";
  $("lanes").style.width = W + "px";
  const film = $("film"); film.style.width = W + "px";
  // WhyNot: 広い形の映像のトラックの絵を、トラックの高さへ引き伸ばさない — 人の顔が潰れて読めない
  if (wide) { film.style.backgroundSize = `${TILE * TAPE.strip.count}px ${Math.max(62, TILE * TAPE.strip.h / TAPE.strip.w)}px`; film.style.backgroundPosition = "0 50%"; }
  else { film.style.backgroundSize = `${TILE * TAPE.strip.count}px 44px`; film.style.backgroundPosition = ""; }
  $("scenes").innerHTML = TAPE.scenes.map(s => `<div class="scene" data-id="${s.id}" style="left:${s.t * PPS}px;width:${(sceneEnd(s) - s.t) * PPS}px"><span>${esc(s.name)}</span></div>`).join("");
  $("scenes").querySelectorAll(".scene").forEach(n => n.onclick = () => { const s = TAPE.scenes.find(x => x.id === n.dataset.id); seek(s.t + .05); select({ track: "video" }); });
  if (wide) layoutRuler(W);
}
function layoutRuler(W) {
  const step = [1, 2, 5, 10, 15].find(s => s * PPS >= 64) || 30, minor = PPS >= 10 ? PPS : step * PPS;
  const r = $("ruler"); r.style.width = W + "px";
  r.style.backgroundImage = `repeating-linear-gradient(90deg, rgba(255,255,255,.3) 0 1px, transparent 1px ${step * PPS}px), repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 1px, transparent 1px ${minor}px)`;
  r.style.backgroundSize = `${W}px 9px, ${W}px 4px`;
  const labels = []; for (let t = 0; t < TAPE.duration; t += step) labels.push(`<span style="left:${t * PPS}px">${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}</span>`);
  r.innerHTML = labels.join("");
}
function renderTracks() {
  const rows = TAPE.timeline;
  $("scriptRow").innerHTML = rows.map(([t, ln], i) => {
    if (!ln) return "";
    const end = i + 1 < rows.length ? rows[i + 1][0] : TAPE.duration, l = TAPE.lines[ln];
    return `<div class="clip ${l.cmd ? "cmd" : ""} ${edits[ln] !== undefined ? "edited" : ""}" data-ln="${ln}" style="left:${t * PPS + 1}px;width:${(end - t) * PPS - 2}px;${l.cmd ? "" : `background:${WHO[l.who]}`}">${esc(l.cmd ? l.cmd.replace(/[<>]/g, "") : flat(textOf(ln)))}</div>`;
  }).join("");

document.querySelectorAll(".mod").forEach(k => k.textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl");

let binHtml = "", binScrolledAt = -Infinity;
function renderBin() {
  const body = $("binBody"), html = chaptersHtml("bfork");
  if (html === binHtml) return;
  const top = body.scrollTop;
  binHtml = html; body.innerHTML = html; wireChapters(body); body.scrollTop = top;
  // WhyNot: 手で欄を送った直後は今のシーンへ引き戻さない — 再生中はシーンが変わるたびに、読んでいた所から飛ばされる
  if (performance.now() - binScrolledAt > 1500) body.querySelector(".chap.cur")?.scrollIntoView({ block: "nearest" });
}
["wheel", "touchstart", "pointerdown"].forEach(ev => $("binBody").addEventListener(ev, () => { binScrolledAt = performance.now(); }, { passive: true }));
function focusBin() {
  renderBin();
  const n = $("binBody").querySelector(".chap.cur");
  if (!n) return;
  n.scrollIntoView({ block: "center", behavior: "smooth" });
  n.classList.add("flash"); setTimeout(() => n.classList.remove("flash"), 900);
}

function markItems() {
  return [...anns.map(a => ({ t: a.seconds, k: annTrack(a), a })), ...Object.keys(edits).map(ln => ({ t: lineStart(+ln) + .3, k: "script", ln: +ln }))];
}
function renderMarks() {
  const items = markItems();
  $("marks").innerHTML = items.map((m, i) => `<div class="mk" data-i="${i}" style="left:${m.t * PPS}px;background:${TRACK[m.k].c}"></div>`).join("");
  $("marks").querySelectorAll(".mk").forEach(n => n.onclick = () => { const m = items[+n.dataset.i]; seek(m.t); selectItem(m); });
}

const Z_MIN = 14, Z_MAX = 240;
const zoomToSlider = p => Math.round(100 * Math.log(p / Z_MIN) / Math.log(Z_MAX / Z_MIN));
function setZoom(p) {
  PPS = Math.max(Z_MIN, Math.min(Z_MAX, p));
  $("zoom").value = zoomToSlider(PPS);
  relayout();
}
$("zoom").addEventListener("input", e => setZoom(Z_MIN * Math.pow(Z_MAX / Z_MIN, e.target.value / 100)));
scroller.addEventListener("wheel", e => {
  if (!extras()) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) { setZoom(PPS * Math.exp(-e.deltaY * .01)); return; }
  scroller.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
}, { passive: false });
let pinch = null;
const span2 = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
const pinchMove = e => { if (e.touches.length !== 2 || form === "phone") return; e.preventDefault(); setZoom(pinch.p * span2(e.touches) / pinch.d); };
const pinchEnd = e => {
  if (e.touches.length >= 2) return;
  pinch.on.forEach(n => { n.removeEventListener("touchmove", pinchMove); n.removeEventListener("touchend", pinchEnd); n.removeEventListener("touchcancel", pinchEnd); });
  pinch = null; endTouch();
};
// WhyNot: touchmove・touchend を scroller で受けない — ズームの relayout が指の下のクリップを作り直し、DOM から外れた target の event は scroller まで上がって来ない
scroller.addEventListener("touchstart", e => {
  if (pinch || form === "phone" || e.touches.length !== 2) return;
  pinch = { d: span2(e.touches), p: PPS, on: [...new Set([...e.touches].map(t => t.target))] };
  pinch.on.forEach(n => { n.addEventListener("touchmove", pinchMove, { passive: false }); n.addEventListener("touchend", pinchEnd); n.addEventListener("touchcancel", pinchEnd); });
}, { passive: true });

// WhyNot: 戻し再生に playbackRate を使わない — video は負の速さを持てない
let shut = null;
function shuttle(dir) {
  setMode(null);
  if (shut && shut.dir === dir) shut.speed = Math.min(4, shut.speed * 2);
  else { stopShuttle(); shut = { dir, speed: 1 }; }
  toast(`${dir > 0 ? "▶" : "◀"} ${shut.speed}×`);
  if (dir > 0) { if (video.paused) togglePlay(); video.playbackRate = shut.speed; return; }
  if (sel) select(null); else video.pause();
  shut.last = performance.now();
  const tick = now => {
    if (!shut || shut.dir > 0) return;
    const t = Math.max(0, video.currentTime - (now - shut.last) / 1000 * shut.speed);
    shut.last = now; video.currentTime = t; follow(t); onTime(t);
    if (t <= 0) { stopShuttle(); return; }
    shut.raf = requestAnimationFrame(tick);
  };
  shut.raf = requestAnimationFrame(tick);
}
function stopShuttle() { if (!shut) return; cancelAnimationFrame(shut.raf); shut = null; video.playbackRate = 1; }
video.addEventListener("pause", () => { if (shut && shut.dir > 0) stopShuttle(); });

const stepFrames = n => { stopShuttle(); seek(Math.max(0, Math.min(TAPE.duration - .01, (frameOf(video.currentTime) + n) / TAPE.fps))); };
const stepSeconds = n => { stopShuttle(); seek(Math.max(0, Math.min(TAPE.duration - .01, video.currentTime + n))); };
function jumpLine(d) {
  stopShuttle();
  const t = video.currentTime, starts = TAPE.timeline.filter(r => r[1]).map(r => r[0]);
  const target = d > 0 ? starts.find(s => s > t + .06) : starts.filter(s => s < t - .3).pop();
  if (target === undefined) return;
  seek(target + .05);
  const ln = lineAt(target + .05);
  if (sel && sel.track === "script" && TAPE.lines[ln]) select({ track: "script", ln });
}
const ORDER = ["video", "script", "sound"];
function cycleTrack(d) {
  stopShuttle();
  let i = sel ? ORDER.indexOf(sel.track) : d > 0 ? -1 : ORDER.length;
  for (let n = 0; n < 3; n++) {
    i = (i + d + 3) % 3;
    const card = $("card" + ORDER[i][0].toUpperCase() + ORDER[i].slice(1));
    if (!card.disabled) { card.onclick(); return; }
  }
}
function noteHere() {
  stopShuttle(); video.pause();
  const t = video.currentTime;
  if (sel && sel.track === "script") { const l = TAPE.lines[sel.ln]; askNote("script", l.cmd ? { line: sel.ln, command: l.cmd } : { line: sel.ln }, null, t); return; }
  if (sel && sel.track === "sound") { const s = sel.sound; askNote("sound", { name: s.name, kind: s.kind, label: s.label, line: s.line }, null, s.t); return; }
  const s = sceneAt(t); askNote("scene", { id: s.id, name: s.name, from: s.t, to: sceneEnd(s) }, null);
}
function startMode(m) { stopShuttle(); if (!sel || sel.track !== "video") select({ track: "video" }); setMode(m); }
function cancelSomething() {
  if (mode) setMode(null); else if (openId) close(); else if (sel) select(null);
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
}
function saveShortcut() {
  if (openId === "noteSheet" || openId === "editSheet") { toast("先に付けるか閉じてください"); return; }
  if (openId === "exportSheet") { $("saveBtn").click(); return; }
  if ($("exportBtn").disabled) { toast("まだ書き出す物がありません"); return; }
  $("exportBtn").onclick(); $("saveBtn").focus();
}
const KEYS = {
  " ": () => { stopShuttle(); togglePlay(); },
  k: () => { stopShuttle(); video.pause(); },
  j: () => shuttle(-1), l: () => shuttle(1),
  ArrowLeft: e => e.shiftKey ? stepSeconds(-1) : stepFrames(-1),
  ArrowRight: e => e.shiftKey ? stepSeconds(1) : stepFrames(1),
  Home: () => { stopShuttle(); seek(0); }, End: () => { stopShuttle(); seek(TAPE.duration - .05); },
  "[": () => jumpLine(-1), "]": () => jumpLine(1),
  ArrowUp: () => cycleTrack(-1), ArrowDown: () => cycleTrack(1),
  n: noteHere, m: noteHere,
  e: () => { if (sel && sel.track === "script" && TAPE.lines[sel.ln].text) openEdit(sel.ln); else toast("台詞を選んでいる時に直せます（↑↓ で台本を選ぶ）"); },
  r: () => startMode("rect"), o: () => startMode("pick"),
  p: () => { if (TAPE.playUrl) $("playHereBtn").click(); }
};
addEventListener("keydown", e => {
  if (!extras()) return;
  // WhyNot: 変換中のキーを拾わない — Esc で変換を取り消したつもりがシートを閉じ、確定の Enter が付けるになる。Safari は確定のキーを isComposing 偽・keyCode 229 で送る
  if (e.isComposing || e.keyCode === 229) return;
  const mod = e.metaKey || e.ctrlKey, typing = e.target.tagName === "TEXTAREA" || (e.target.tagName === "INPUT" && e.target.type !== "range");
  if (mod && e.key === "Enter") { e.preventDefault(); if (openId === "noteSheet") $("noteSave").click(); else if (openId === "editSheet") $("editSave").click(); return; }
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); saveShortcut(); return; }
  if (e.key === "Escape") { e.preventDefault(); cancelSomething(); return; }
  if (typing || mod || e.altKey || e.target.type === "range") return;
  const fn = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!fn) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur();
  fn(e);
});

const tip = $("tip");
function tipFor(n) {
  if (n.classList.contains("clip")) {
    const ln = +n.dataset.ln, l = TAPE.lines[ln];
    if (l.cmd) return `<span class="m">演出 · ${yarn}:${ln}</span>\n${esc(l.cmd)}`;
    return `<span class="m"><b style="color:${WHO[l.who]}">${esc(l.who)}</b> · ${yarn}:${ln}${edits[ln] !== undefined ? " · 直した文章" : ""}</span>\n<span class="mincho">${esc(textOf(ln).replace(/／/g, "\n"))}</span>`;
  }
  if (n.classList.contains("snd")) { const s = TAPE.sounds[+n.dataset.i]; return `♪ ${esc(s.label)}\n<span class="m">${s.name} · ${s.kind === "ambience" ? "環境音" : "効果音"} · ${mmss(s.t)} · ${yarn}:${s.line}</span>`; }
  if (n.classList.contains("scene")) { const s = TAPE.scenes.find(x => x.id === n.dataset.id); return `${esc(s.name)}\n<span class="m">${mmss(s.t)} – ${mmss(sceneEnd(s))}</span>`; }
  if (n.classList.contains("mk")) {
    const m = markItems()[+n.dataset.i];
    if (m.a) return `<span class="m">${TRACK[m.k].name}: ${esc(label(m.a))} · ${mmss(m.t)}</span>\n${esc(m.a.note)}`;
    return `<span class="m">台本: 文章の直し · ${yarn}:${m.ln}</span>\n<span class="mincho">${esc(edits[m.ln].replace(/／/g, "\n"))}</span>`;
  }
  if (n.classList.contains("fork")) { const br = TAPE.branches[+n.dataset.i]; return `分岐: ${esc(br.question)}\n<span class="m">${br.routes.map(r => (r.here ? "✓ " : "") + esc(r.label)).join(" / ")}</span>`; }
  if (n.classList.contains("card") && !n.disabled) return esc(n.querySelector(".v").textContent);
  return "";
}
function placeTip(e) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 18;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
document.addEventListener("mouseover", e => {
  if (!extras()) return;
  const n = e.target.closest(".clip,.snd,.scene,.mk,.fork,.card"), html = n ? tipFor(n) : "";
  if (!html) { tip.classList.remove("on"); return; }
  tip.innerHTML = html; tip.classList.add("on"); placeTip(e);
});
document.addEventListener("mousemove", e => { if (tip.classList.contains("on")) placeTip(e); });
scroller.addEventListener("scroll", () => tip.classList.remove("on"));

applyTape(); applyForm();
setIcon(); buildTimeline(); refresh(); onTime(0);
fetch("kesshou.mp4").then(r => r.blob()).then(b => { video.src = URL.createObjectURL(b); }).catch(() => { video.src = "kesshou.mp4"; });
</script>
