<!doctype html>
<meta charset="utf-8">
<title>web-capture known picture</title>
<style>html,body{margin:0;background:#f0f}canvas{display:block;width:64px;height:48px}</style>
<canvas id="c" width="64" height="48"></canvas>
<script>
// 既知の絵: 地 (32,64,96) / 左下 16x12 を scissor で赤 (255,0,0) / x 32..47・GL の y 24..39 をシェーダーの四角で (0,255,128)。
// docs/web-capture.md の約束どおり、rAF の中で描いて同じ処理の中で readPixels する（preserveDrawingBuffer は false のまま）。
(function () {
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl2", {
    alpha: false, antialias: false, stencil: true, depth: true,
    premultipliedAlpha: false, preserveDrawingBuffer: false,
  });
  if (!gl) { window.fgeCaptureError = "webgl2 が取れない"; return; }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function toBase64(bytes) {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }
  function rendererName() {
    const ext = gl.getExtension("WEBGL_debug_renderer_info");
    return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  }

  requestAnimationFrame(function () {
    try {
      const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
      gl.viewport(0, 0, w, h);
      gl.clearColor(32 / 255, 64 / 255, 96 / 255, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      gl.enable(gl.SCISSOR_TEST);
      gl.scissor(0, 0, 16, 12);
      gl.clearColor(1, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.disable(gl.SCISSOR_TEST);

      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER,
        "#version 300 es\nin vec2 p;\nvoid main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER,
        "#version 300 es\nprecision mediump float;\nout vec4 o;\nvoid main(){ o = vec4(0.0, 1.0, 128.0/255.0, 1.0); }"));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      const x0 = 32 / w * 2 - 1, x1 = 48 / w * 2 - 1, y0 = 24 / h * 2 - 1, y1 = 40 / h * 2 - 1;
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([x0, y0, x1, y0, x0, y1, x1, y0, x1, y1, x0, y1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 6);

      const pixels = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      const shot = { width: w, height: h, rgba: toBase64(pixels), origin: "bottom-left", renderer: rendererName() };
      window.fgeCapture = function () { return shot; };
      window.fgeCaptureReady = true;
    } catch (e) {
      window.fgeCaptureError = String(e && e.message || e);
    }
  });
})();
</script>
