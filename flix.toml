[package]
version     = "0.1.0"
flix        = "0.78.0"
repository  = "github:ababup1192/flix_game_engine"

# ルート src/ は各エンジンパッケージの src/ への symlink 集で、実体は一切持たない。
# Flix の依存解決 (make sync の fpkg 配布) を経由せず、全パッケージを 1 ソースツリーとして
# コンパイルする。examples が 4 パッケージを同時依存して成立している以上、union も成立する。
# Flix コミュニティビルドはこのマニフェストでルートから `flix build` を実行する。

[dependencies]

# コンパイルに必要な LWJGL の Java API のみ宣言する。
# ネイティブ jar は実行時専用なので、ビルド検証しかしないルートでは持たない
# (実行・配布は各パッケージ / examples 側の flix.toml が担う)。
[mvn-dependencies]
"org.lwjgl:lwjgl"        = "3.4.1"
"org.lwjgl:lwjgl-opengl" = "3.4.1"
"org.lwjgl:lwjgl-stb"    = "3.4.1"
"org.lwjgl:lwjgl-openal" = "3.4.1"
"org.lwjgl:lwjgl-glfw"   = "3.4.1"
"org.lwjgl:lwjgl-sdl"    = "3.4.1"

# GL の層の jar（render_gl/java・make gl-jar が lib/external に置く）。行は make gl-jar-pin が書く（名前は render_gl/java のハッシュ）。
[jar-dependencies]
"fge-gl-8a252438fd38.jar" = "url:https://github.com/ababup1192/flix_game_engine/releases/download/fge-gl-8a252438fd38/fge-gl-8a252438fd38.jar"
